name: Build ACME Lego Cron image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acme-lego-cron-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yusoofsh/acme-lego-cron:latest
            ghcr.io/yusoofsh/acme-lego-cron:security-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=acme-lego-cron
          cache-to: type=gha,mode=max,scope=acme-lego-cron
      - name: Verify native helper without production credentials
        env:
          IMAGE: ghcr.io/yusoofsh/acme-lego-cron@${{ steps.image.outputs.digest }}
        run: |
          set -eu
          docker pull "$IMAGE"
          docker run --rm --network none --entrypoint /lego "$IMAGE" --version | grep -F 'lego version v5.6.1+dev-detach'
          docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}' | grep -F './cron.sh'
          printf 'Verified candidate: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
